# ********************************
# C3HT universal VRx backpack with on-board IMU head tracker (ESP32-C3)
# Boards: C3HT-Nano (bare ESP32-C3FH4, Ghost Atto drop-in) and C3HT-Mini (ESP32-C3-MINI-1/-1U module)
# One pin map for both boards:
#   IMU  : INT=IO3  SDA=IO4  SCL=IO5                (ICM-42607-C @0x68 WHO_AM_I 0x61; other ICM-426xx,
#                                                    QMI8658 / MPU6050 also detected)
#   SPI  : MOSI=IO6 CLK=IO7  CS=IO10  CS2=IO2       (Rapidfire / SteadyView / RX5808 diversity)
#   UART : TX=IO21  RX=IO20                          (Orqa GHST / Skyzone MSP / Fusion; also first flashing)
#   BOOT button/pad IO9, status LED IO8 (active low), USB IO18/IO19 (Mini only: D+/D- bottom pads;
#   the Nano has no USB - flash it over the T/R holes with BT held low)
# NEVER set ARDUINO_USB_CDC_ON_BOOT=1 for any C3HT env: it moves Serial to the
# USB-Serial/JTAG (HWCDC) port, so GHST/MSP/CRSF to the goggle on IO21/IO20 stops
# working (HWCDC also broke MSP in upstream PR #184). Keep the UART on Serial.
# ********************************

[c3ht_common]
build_flags =
	${env_common_esp32c3.build_flags}
	-D HAS_HEADTRACKING
	-D PIN_BUTTON=9
	-D PIN_LED=8
	-D LED_INVERTED
	-D PIN_INT=3
	-D PIN_SDA=4
	-D PIN_SCL=5
	# MSP payload bounds check (lib/MSP/msp.h) for every C3HT env, not only C3HTEU_*
	-D C3HT_FIX_MSP_BOUNDS
	# WiFi, binding and power-cycle behaviour: the upstream ExpressLRS Backpack
	# behaviour (owner decisions 2026-11-03 and 2026-11-20). These C3HT options exist
	# in the code and are OFF, for the C3HTEU_* envs too:
	#   -D C3HT_ESPNOW_TX_DBM=<dBm>            cap WiFi / ESP-NOW TX power (default 19.5 dBm;
	#                                          the C3HTEU_* envs use C3HT_EU_MAX_TX_QDBM)
	#   -D C3HT_BOOTCOUNT_POWERON_ONLY         3-power-cycle trigger counts only power-on resets
	#   -D C3HT_WIFI_IDLE_TIMEOUT_S=<seconds>  leave WiFi mode after that long without a client
	# Brownout: check the detector is armed (sdkconfig level 7, kept for the 3.3 V
	# slot rail, H16) and count brownout resets since power-on in RTC memory;
	# shown in the web UI (stock /config, EU /api/info) and the debug log.
	-D C3HT_BROWNOUT_STATS
	# Weakest pad driver (~5 mA) on the SPI bit-bang pins MOSI/CLK/CS/CS2: no series
	# resistors on the small board, goggles may drive the same lines (H11). UART TX
	# keeps the default. No effect on targets without PIN_MOSI.
	-D C3HT_SPI_LOW_DRIVE
	; AHRS time step from the measured data-ready interval instead of a fixed 0.01 s
	-D HT_MEASURED_SAMPLE_PERIOD
	; ICM-426xx at +-1000 dps / +-4 g instead of +-2000 dps / +-16 g (finer LSB, ample range)
	-D HT_ICM_FS_1000DPS_4G
	; gyro bias: stillness-gated boot calibration, runtime estimate with step clamp,
	; temperature compensation, web "ci" as a still mean (lib/HeadTrackerCore/GyroBias)
	-D HT_GYRO_BIAS_TRACKING
	; PTR full-scale angle per axis, whole degrees 1..180 (lib/HeadTrackerCore/PtrScale.h).
	; Unset = 180 = upstream mapping (-180..+180 deg -> 1000..2000 us); smaller values
	; saturate beyond the limit instead of wrapping. Example (DESIGN_RESEARCH H18):
	; -D HT_MAX_ANGLE_PAN=90 -D HT_MAX_ANGLE_TILT=60 -D HT_MAX_ANGLE_ROLL=45

[c3ht_spi]
build_flags =
	-D PIN_MOSI=6
	-D PIN_CLK=7
	-D PIN_CS=10

[env:C3HT_Orqa_via_UART]
extends = env_common_esp32c3, orqa_backpack_common
build_flags =
	${c3ht_common.build_flags}
	${orqa_backpack_common.build_flags}
	; TODO(C3HT-Nano): factory board orientation for the fixed FPV.Connect slot, applied by
	; VrxBackpackConfig::SetDefaults() (fresh or reset config only, never over a saved one):
	;   -D HT_DEFAULT_ORIENTATION=x,y,z      ; degrees, same order as the web UI "o:x:y:z"
	; Not set: the IMU-to-goggle rotation is not derivable from the docs, and this env is
	; shared with a Mini mounted on an Orqa, which must not inherit it (DESIGN_RESEARCH M17).
	; Measure it once on a real Nano in a closed Orqa goggle: WiFi mode, head-tracking page,
	; adjust the orientation until nodding moves the model in pitch only and turning in
	; heading only, Save, reconnect; the page then shows heading/pitch/roll = z/x/y. Put
	; x=pitch, y=roll, z=heading here, in a Nano-only env (e.g. C3HT_Nano_Orqa_via_UART).

[env:C3HT_Orqa_via_WIFI]
extends = env:C3HT_Orqa_via_UART

[env:C3HT_Rapidfire_via_UART]
extends = env_common_esp32c3, rapidfire_vrx_backpack_common
build_flags =
	${c3ht_common.build_flags}
	${rapidfire_vrx_backpack_common.build_flags}
	${c3ht_spi.build_flags}

[env:C3HT_Rapidfire_via_WIFI]
extends = env:C3HT_Rapidfire_via_UART

[env:C3HT_SteadyView_via_UART]
extends = env_common_esp32c3, steadyview_vrx_backpack_common
build_flags =
	${c3ht_common.build_flags}
	${steadyview_vrx_backpack_common.build_flags}
	${c3ht_spi.build_flags}

[env:C3HT_SteadyView_via_WIFI]
extends = env:C3HT_SteadyView_via_UART

[env:C3HT_RX5808_via_UART]
extends = env_common_esp32c3, rx5808_vrx_backpack_common
build_flags =
	${c3ht_common.build_flags}
	${rx5808_vrx_backpack_common.build_flags}
	${c3ht_spi.build_flags}
	-D PIN_CS_2=2

[env:C3HT_RX5808_via_WIFI]
extends = env:C3HT_RX5808_via_UART

[env:C3HT_SkyzoneMSP_via_UART]
extends = env_common_esp32c3, skyzone_msp_vrx_backpack_common
build_flags =
	${c3ht_common.build_flags}
	${skyzone_msp_vrx_backpack_common.build_flags}

[env:C3HT_SkyzoneMSP_via_WIFI]
extends = env:C3HT_SkyzoneMSP_via_UART

[env:C3HT_Fusion_via_UART]
extends = env_common_esp32c3, fusion_vrx_backpack_common
build_flags =
	${c3ht_common.build_flags}
	${fusion_vrx_backpack_common.build_flags}

[env:C3HT_Fusion_via_WIFI]
extends = env:C3HT_Fusion_via_UART

# ********************************
# C3HT EU build (C3HTEU_*): compile-time variant for the EU market (RED 3(3)(d)/(e),
# EN 18031-1/-2). Per-device password card, authenticated web UI, AP only on demand,
# signed OTA (ECDSA P-256), no home Wi-Fi, TX power 19.5 dBm (upstream default) applied and
# read back before the first frame, BLE released. The EU service console is USB-only: Mini
# boards only, until a UART factory console exists for the Nano (eu-build/README.md).
# USB flashing stays open (GPL-3.0 Installation Information).
# OTA public key(s): set C3HT_EU_PUBKEYS=<pub.pem>[;<pub2.pem>] before building, or
# commit keys/c3ht_eu_release_pub.pem. Without a key, OTA is compiled out (USB only).
# Release images: add -D C3HT_EU_RELEASE (refuses DEV keys and DEBUG_LOG).
# Design: C3HT project firmware/eu-build/DESIGN.md
# ********************************

[c3ht_eu]
build_flags =
	-D C3HT_EU_BUILD
	-D C3HT_EU_SECURITY_VERSION=1
extra_scripts =
	${env.extra_scripts}
	pre:python/c3ht_eu_pre.py
	python/c3ht_eu_post.py
board_build.partitions = targets/c3ht_eu_partitions.csv

[env:C3HTEU_Orqa_via_UART]
extends = env_common_esp32c3, orqa_backpack_common
board_build.partitions = ${c3ht_eu.board_build.partitions}
extra_scripts = ${c3ht_eu.extra_scripts}
build_flags =
	${c3ht_common.build_flags}
	${orqa_backpack_common.build_flags}
	${c3ht_eu.build_flags}

[env:C3HTEU_Orqa_via_WIFI]
extends = env:C3HTEU_Orqa_via_UART

[env:C3HTEU_Rapidfire_via_UART]
extends = env_common_esp32c3, rapidfire_vrx_backpack_common
board_build.partitions = ${c3ht_eu.board_build.partitions}
extra_scripts = ${c3ht_eu.extra_scripts}
build_flags =
	${c3ht_common.build_flags}
	${rapidfire_vrx_backpack_common.build_flags}
	${c3ht_spi.build_flags}
	${c3ht_eu.build_flags}

[env:C3HTEU_Rapidfire_via_WIFI]
extends = env:C3HTEU_Rapidfire_via_UART

[env:C3HTEU_SteadyView_via_UART]
extends = env_common_esp32c3, steadyview_vrx_backpack_common
board_build.partitions = ${c3ht_eu.board_build.partitions}
extra_scripts = ${c3ht_eu.extra_scripts}
build_flags =
	${c3ht_common.build_flags}
	${steadyview_vrx_backpack_common.build_flags}
	${c3ht_spi.build_flags}
	${c3ht_eu.build_flags}

[env:C3HTEU_SteadyView_via_WIFI]
extends = env:C3HTEU_SteadyView_via_UART

[env:C3HTEU_RX5808_via_UART]
extends = env_common_esp32c3, rx5808_vrx_backpack_common
board_build.partitions = ${c3ht_eu.board_build.partitions}
extra_scripts = ${c3ht_eu.extra_scripts}
build_flags =
	${c3ht_common.build_flags}
	${rx5808_vrx_backpack_common.build_flags}
	${c3ht_spi.build_flags}
	-D PIN_CS_2=2
	${c3ht_eu.build_flags}

[env:C3HTEU_RX5808_via_WIFI]
extends = env:C3HTEU_RX5808_via_UART

[env:C3HTEU_SkyzoneMSP_via_UART]
