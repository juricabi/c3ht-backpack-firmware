; ExpressLRS Backpack PlatformIO Project Configuration File

[platformio]
extra_configs =
	# keep common first
	targets/common.ini
	targets/debug.ini
	targets/txbp_esp.ini
	targets/timer.ini
	# defined one by one to maintain the order
	targets/aat.ini
	targets/fusion.ini
	targets/hdzero.ini
	targets/orqa.ini
	targets/rapidfire.ini
	targets/rx5808.ini
	targets/skyzone.ini
	targets/mfd_crossbow.ini
	targets/c3ht.ini

# ------------------------- HOST UNIT TESTS -----------------
# pio test -e native   (needs a host gcc/g++ in PATH; tests live in test/, only
# hardware-independent libraries such as lib/HeadTrackerCore are linked)
[env:native]
platform = native
framework =
extra_scripts =
lib_deps =
monitor_filters =
test_build_src = no
build_flags = -Wall -lm
